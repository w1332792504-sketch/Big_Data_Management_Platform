services:
  mysql:
    image: mysql:latest
    container_name: data_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: data_manager
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql-data:/var/lib/mysql
      - ./docker-data/mysql-conf:/etc/mysql/conf.d
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - dm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data_manager_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://data_manager_mysql:3306/data_manager?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      DATAX_HOME: /opt/datax
    ports:
      - "8080:8080"
    volumes:
      - ./docker-data/logs:/app/logs
      - ./docker-data/datax/job:/opt/datax/job
    depends_on:
      - mysql
    networks:
      - dm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data_manager_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dm_network

networks:
  dm_network:
    driver: bridge
